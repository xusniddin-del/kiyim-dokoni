<style>
/* Layout: one phone-width column (max 480px), sky-tinted top, floating bottom nav with a raised "Sotuv" button */
:root{
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --bg:#F2F3F9; --sky:#D9DDFF; --sky2:#ECE4FF; --surface:#FFFFFF; --surface-2:#F4F5FA; --border:#E3E6EF; --border-2:#CDD2DF;
  --text:#12152B; --text-2:#5A6075;
  --primary:#5B52F0; --primary-ink:#FFFFFF; --primary-soft:#EEF0FF; --primary-text:#4338CA;
  --ok-soft:#DCFCE7; --ok-text:#166534; --ok-fill:#15803D;
  --bad-soft:#FEE2E2; --bad-text:#B91C1C; --bad-fill:#DC2626;
  --warn-soft:#FEF3C7; --warn-text:#854D0E;
  --shadow:0 1px 2px rgba(18,21,43,.05),0 8px 24px rgba(40,48,110,.08);
  --shadow-lg:0 4px 10px rgba(18,21,43,.06),0 18px 40px rgba(40,48,110,.16);
  --overlay:rgba(18,21,43,.45);
  --toast-bg:#12152B; --toast-fg:#FFFFFF;
  --violet:linear-gradient(160deg,#8B7CF8 0%,#5B4BE8 75%);
  --orange:linear-gradient(160deg,#F7931E 0%,#C9520A 75%);
  --hero:linear-gradient(155deg,#6F67F5 0%,#4F46E5 65%,#4338CA 100%);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --sky:#1C2050; --sky2:#251B45; --surface:#171A2E; --surface-2:#1F2338; --border:#2A2F48; --border-2:#3A4062;
  --text:#ECEEF8; --text-2:#A3A9C2; --primary:#5B52F0; --primary-ink:#FFFFFF; --primary-soft:#23264A; --primary-text:#B4B0FF;
  --ok-soft:#12301F; --ok-text:#6EE7A0; --ok-fill:#15803D; --bad-soft:#3A1518; --bad-text:#FCA5A5; --bad-fill:#DC2626;
  --warn-soft:#3A2C0B; --warn-text:#FCD34D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 4px 10px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
  --overlay:rgba(0,0,0,.6); --toast-bg:#ECEEF8; --toast-fg:#12152B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --sky:#1C2050; --sky2:#251B45; --surface:#171A2E; --surface-2:#1F2338; --border:#2A2F48; --border-2:#3A4062;
  --text:#ECEEF8; --text-2:#A3A9C2; --primary:#5B52F0; --primary-ink:#FFFFFF; --primary-soft:#23264A; --primary-text:#B4B0FF;
  --ok-soft:#12301F; --ok-text:#6EE7A0; --ok-fill:#15803D; --bad-soft:#3A1518; --bad-text:#FCA5A5; --bad-fill:#DC2626;
  --warn-soft:#3A2C0B; --warn-text:#FCD34D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 4px 10px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.45);
  --overlay:rgba(0,0,0,.6); --toast-bg:#ECEEF8; --toast-fg:#12152B; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::after{content:"";position:fixed;inset:0 0 auto 0;height:340px;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 18% at 16% 20%,rgba(255,255,255,.35),transparent 70%),linear-gradient(180deg,var(--sky) 0%,var(--sky2) 40%,var(--bg) 100%)}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:16px;height:16px}.ico.lg{width:24px;height:24px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.app{max-width:480px;margin:0 auto;padding-top:16px;padding-bottom:calc(130px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.app.has-cart{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:12px;min-height:48px}
.top .grow{flex:1;min-width:0}
.h1{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.h2{font-size:20px;line-height:26px;font-weight:800;letter-spacing:-.01em}
.h3{font-size:17px;line-height:23px;font-weight:700}
.meta{font-size:14px;line-height:20px;color:var(--text-2);font-weight:500}
.lab{font-size:13px;line-height:18px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-2)}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);border:1px solid var(--border)}
.pad{padding:16px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;font-weight:700;font-size:16px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--primary);color:var(--primary-ink);box-shadow:0 8px 18px rgba(91,82,240,.3)}
.btn-s{background:var(--primary-soft);color:var(--primary-text)}
.btn-n{background:var(--surface);color:var(--text);border-color:var(--border-2)}
.btn-d{background:var(--bad-fill);color:#fff}
.btn-w{background:#fff;color:#4338CA}
.btn-sm{min-height:44px;padding:0 16px;font-size:15px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.ib{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text);cursor:pointer;flex:none;box-shadow:var(--shadow)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.badge{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:2px 10px 2px 8px;border-radius:999px;font-size:13px;line-height:18px;font-weight:700;white-space:nowrap}

.b-ok{background:var(--ok-soft);color:var(--ok-text)}.b-bad{background:var(--bad-soft);color:var(--bad-text)}
.b-warn{background:var(--warn-soft);color:var(--warn-text)}.b-p{background:var(--primary-soft);color:var(--primary-text)}
.b-n{background:var(--surface-2);color:var(--text-2)}

.ptabs{display:flex;gap:6px;padding:5px;background:var(--surface);border:1px solid var(--border);border-radius:999px;overflow-x:auto;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.pt{flex:1 1 auto;min-height:40px;padding:0 10px;border-radius:999px;border:0;background:transparent;font-weight:700;font-size:14px;color:var(--text-2);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pt[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;color:var(--text)}

.search{position:relative}

.input,.select,.textarea{width:100%;min-height:50px;border-radius:16px;border:1.5px solid var(--border-2);background:var(--surface);padding:12px 14px;font-size:16px;line-height:22px;color:var(--text)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.chart{display:flex;align-items:flex-end;gap:3px;height:160px;border-bottom:1.5px solid var(--border);padding-top:8px}
.bar{flex:1;min-width:0;border:0;padding:0;background:var(--primary);border-radius:6px 6px 2px 2px;cursor:pointer;opacity:.85}
.bar.sel,.bar:hover{opacity:1;outline:2px solid var(--primary-text);outline-offset:1px}
.bar.zero{background:var(--border-2);min-height:3px}
.xl{display:flex;gap:3px;margin-top:6px}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--text-2);font-weight:600;overflow:visible;white-space:nowrap}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px}
.split span{display:block;height:100%}
.legend{display:flex;flex-direction:column;gap:8px}
.legend .row{justify-content:space-between}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.hbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.hbar span{display:block;height:100%;background:var(--primary);border-radius:999px}
.demo{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:18px;background:var(--warn-soft);color:var(--warn-text);font-size:14px;font-weight:600}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ci{width:64px;height:64px;border-radius:22px}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{transform:translate(-50%,-16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function seed(){
  let s=20261109;const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const P=[
    ["Klassik oq ko'ylak","Ko'ylak",'KY-101','Oq',120000,189000,{S:2,M:5,L:4,XL:1,XXL:0}],
    ['Jinsi shim slim','Shim','SH-204',"Ko'k",160000,259000,{S:1,M:4,L:3,XL:2,XXL:0}],
    ['Qishki kurtka','Kurtka','KR-310','Qora',420000,690000,{S:0,M:2,L:1,XL:0,XXL:1}],
    ['Trikotaj sviter','Sviter','SV-115','Bej',140000,229000,{S:1,M:3,L:3,XL:1,XXL:0}],
    ['Sport kostyum','Sport','SP-402','Kulrang',230000,379000,{S:0,M:4,L:2,XL:2,XXL:1}],
    ['Krossovka','Poyabzal','PB-520','Oq',280000,449000,{38:0,39:1,40:2,41:3,42:1,43:0,44:1,45:0}],
    ['Klassik tufli','Poyabzal','PB-533','Qora',310000,499000,{38:0,39:0,40:1,41:1,42:2,43:1,44:0,45:0}],
    ['Futbolka basic','Futbolka','FT-010','Qora',45000,89000,{S:6,M:8,L:5,XL:3,XXL:2}],
    ['Ayollar ko\'ylagi',"Ko'ylak",'KY-145','Moviy',170000,279000,{S:2,M:1,L:0,XL:0,XXL:0}],
    ['Charm kamar','Aksessuar','AK-701','Jigarrang',60000,119000,{Yagona:7}],
    ['Qishki qalpoq','Aksessuar','AK-712','Qora',35000,69000,{Yagona:2}],
    ['Chino shim','Shim','SH-230','Haki',150000,239000,{S:0,M:2,L:3,XL:1,XXL:0}],
  ].map(([name,cat,sku,color,cost,price,sizes],i)=>({id:'p'+(i+1),name,cat,sku,color,cost,price,sizes}));
  const C=[['Nodira Karimova','+998 90 123 45 67'],['Jasur Toshmatov','+998 91 234 56 78'],['Malika Yusupova','+998 93 345 67 89'],['Sardor Aliyev','+998 94 456 78 90'],['Dilfuza Rahimova','+998 97 567 89 01'],['Bekzod Ergashev','+998 99 678 90 12'],['Gulnoza Saidova','+998 88 789 01 23'],['Aziz Qodirov','+998 90 890 12 34']]
    .map(([name,phone],i)=>({id:'c'+(i+1),name,phone,note:i===0?'Doimiy mijoz, M o\'lcham':'',created:new Date(Date.now()-90*864e5).toISOString()}));
  const sales=[],payments=[];const now=new Date();
  for(let d=29;d>=0;d--){
    const day=new Date(now);day.setDate(now.getDate()-d);
    const n=d===0?Math.max(2,Math.min(5,now.getHours()-9)):2+Math.floor(r()*5)+(day.getDay()===6||day.getDay()===0?2:0);
    for(let k=0;k<n;k++){
      const t=new Date(day);const maxH=d===0?Math.max(10,now.getHours()):20;t.setHours(10+Math.floor(r()*(maxH-10+1)),Math.floor(r()*60),0,0);
      if(d===0&&t>now)t.setTime(now.getTime()-(k+1)*25*60000);
      const items=[];const m=1+Math.floor(r()*(r()<.7?1:3));
      for(let j=0;j<m;j++){const p=P[Math.floor(r()*P.length)];const ks=Object.keys(p.sizes);items.push({pid:p.id,name:p.name,sku:p.sku,size:ks[Math.floor(r()*ks.length)],qty:r()<.85?1:2,price:p.price,cost:p.cost});}
      const sub=items.reduce((a,i)=>a+i.price*i.qty,0);const disc=r()<.2?Math.round(sub*.05/1000)*1000:0;
      const x=r();const pay=x<.5?'naqd':x<.86?'karta':'nasiya';
      const cid=pay==='nasiya'||r()<.35?C[Math.floor(r()*C.length)].id:null;
      sales.push({id:'s'+sales.length,at:t.toISOString(),items,sub,discount:disc,total:sub-disc,pay,cid});
      if(pay==='nasiya'&&d>3&&r()<.6)payments.push({id:'y'+payments.length,cid,amount:Math.round((sub-disc)*(r()<.5?1:.5)/1000)*1000,at:new Date(t.getTime()+2*864e5).toISOString()});
    }
  }
  sales.sort((a,b)=>a.at<b.at?-1:1);
  return {v:1,demo:true,store:{name:'Moda Butik',seller:'Dilshod'},products:P,customers:C,sales,payments};
}

function wrap(title,body,sub){return `<button class="overlay" type="button" aria-label="Yopish" data-a="close"></button><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t"><div class="grab"></div><div class="between"><div style="min-width:0"><h2 class="h2" id="sh-t">${title}</h2>${sub?`<div class="meta">${sub}</div>`:''}</div><button class="ib" type="button" aria-label="Yopish" data-a="close">${ic('x')}</button></div>${body}</div>`}

function confirmBtn(key,label,act,v){return U.confirm===key?`<div class="grid2"><button class="btn btn-n" type="button" data-a="unconfirm">Bekor qilish</button><button class="btn btn-d" type="button" data-a="${act}" data-v="${v||''}">${ic('trash')}Ha, o'chirish</button></div>`:`<button class="btn btn-n btn-block" type="button" data-a="confirm" data-v="${key}" style="color:var(--bad-text)">${ic('trash')}${label}</button>`}

   <div><div class="lab" style="margin-bottom:8px">O'lcham</div><div class="sizes" role="group" aria-label="O'lcham">${sizes.map(s=>`<button class="sz" type="button" aria-pressed="${sel===s}" data-a="size" data-v="${esc(s)}" ${avail(s)<=0?'disabled':''}>${esc(s)}<small>${avail(s)>0?avail(s)+' dona':"yo'q"}</small></button>`).join('')}</div></div>
   <div class="between"><span class="lab">Soni</span><div class="step"><button type="button" aria-label="Kamaytirish" data-a="qty" data-v="-1" ${qty<=1?'disabled':''}>${ic('minus')}</button><span class="num" aria-live="polite">${qty}</span><button type="button" aria-label="Ko'paytirish" data-a="qty" data-v="1" ${!sel||qty>=avail(sel)?'disabled':''}>${ic('plus')}</button></div></div>
   <button class="btn btn-p btn-block" type="button" data-a="addCart" data-v="${p.id}" ${sel?'':'disabled'}>${ic('cart')}${sel?`Savatchaga · ${som(p.price*qty)}`:"Avval o'lchamni tanlang"}</button>`);

   <div class="tot num"><div class="between"><span class="muted">Jami</span><span>${som(sub)}</span></div>${disc?`<div class="between"><span class="muted">Chegirma</span><span>−${som(disc)}</span></div>`:''}<div class="between"><b>To'lanadi</b><b style="font-size:20px">${som(total)}</b></div></div>

  if(t==='cpick')return shCPick();
  if(t==='sale'){const s=DB.sales.find(x=>x.id===a);return s?shSale(s,b==='new'):''}
  if(t==='prod'){const p=prod(a);return p?shProd(p):''}
  if(t==='restock'){const p=prod(a);return p?shRestock(p):''}
  if(t==='pform')return shPForm(a?prod(a):null);
  if(t==='cust'){const c=cust(a);return c?shCust(c):''}
  if(t==='cform')return a==='cart'?shCForm(null,'cart'):shCForm(a?cust(a):null);
  if(t==='settings')return shSettings();
  if(t==='import')return shImport();
  return '';
}

/* ================= render ================= */
const SCREENS={home:Home,sell:Sell,stock:Stock,cust:Cust,rep:Rep};
const TABS=[['home','home','Bosh sahifa'],['stock','box','Ombor'],['sell','cart','Sotuv'],['cust','users','Mijozlar'],['rep','chart','Hisobot']];
let lastTab=null;
function focusKeep(fn){const a=document.activeElement;const id=a&&a.id;let st=null,en=null;try{st=a.selectionStart;en=a.selectionEnd}catch(e){}fn();if(id){const n=$(id);if(n&&n!==document.activeElement){n.focus({preventScroll:true});try{if(st!=null)n.setSelectionRange(st,en)}catch(e){}}}}
function render(){
  focusKeep(()=>{
    const app=$('app');app.innerHTML=SCREENS[U.tab]();app.classList.toggle('has-cart',U.tab==='sell'&&U.cart.length>0);
    if(lastTab!==U.tab){window.scrollTo(0,0);lastTab=U.tab;}
    renderLayer();
  });
}
function renderLayer(){
  focusKeep(()=>{
    const cb=U.tab==='sell'&&U.cart.length&&!U.sheet?`<div class="cartbar"><div class="in"><div style="flex:1;min-width:0"><div class="meta">${cartCount()} ta mahsulot</div><div class="num" style="font-weight:800;font-size:18px">${som(cartTotal())}</div></div><button class="btn btn-p" type="button" data-a="sheet" data-v="cart">${ic('cart')}Savatcha</button></div></div>`:'';
    const nav=`<nav class="nav" aria-label="Asosiy menyu"><div class="in">${TABS.map(([k,i,l])=>`<button class="tab${k==='sell'?' fab':''}" type="button" data-a="tab" data-v="${k}"${U.tab===k?' aria-current="page"':''}><span class="pill">${ic(i,k==='sell'?'lg':'')}</span>${k==='sell'&&cartCount()?`<span class="cnt num">${cartCount()}</span>`:''}${l}</button>`).join('')}</div></nav>`;
    $('layer').innerHTML=cb+nav+sheetHTML()+(U.toast?`<div class="toast" role="status">${ic('check')}${esc(U.toast)}</div>`:'');
    document.body.style.overflow=U.sheet?'hidden':'';
  });
}
const all=()=>{save();render();};

/* ================= actions ================= */
function openSheet(v){U.sheet=v;U.f={};U.confirm=null;}
async function copy(text,ok){try{await navigator.clipboard.writeText(text);toast(ok);}catch(e){U.sheet='import';U.f={imp:text,_err:"Avtomatik nusxalab bo'lmadi — matnni belgilab, o'zingiz nusxalang."};renderLayer();}}
function download(name,text,type){try{const b=new Blob([text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);return true}catch(e){return false}}
const A={
  tab:v=>{U.tab=v;U.sheet=null;},
  sheet:v=>openSheet(v),
  close:()=>{U.sheet=null;U.confirm=null;},
  confirm:v=>{U.confirm=v},unconfirm:()=>{U.confirm=null},
  cat:v=>{U.cat=v},sfilter:v=>{U.sfilter=v},cfilter:v=>{U.cfilter=v},
  period:v=>{U.period=+v;U.sel=null},bar:v=>{U.sel=v},
  lowstock:()=>{U.tab='stock';U.sfilter='low'},debtors:()=>{U.tab='cust';U.cfilter='debt'},
  size:v=>{U.f.size=v;U.f.qty=1},
  qty:v=>{U.f.qty=Math.max(1,(+U.f.qty||1)+(+v))},
  addCart:pid=>{const p=prod(pid);const s=U.f.size;const q=+U.f.qty||1;if(!p||!s)return;const ex=U.cart.find(i=>i.pid===pid&&i.size===s);if(ex)ex.qty+=q;else U.cart.push({pid,size:s,qty:q,price:p.price});U.sheet=null;toast(`${p.name} (${s}) savatchaga qo'shildi`)},
  cq:v=>{const[ix,d]=v.split(':').map(Number);const it=U.cart[ix];if(!it)return;it.qty+=d;if(it.qty<=0)U.cart.splice(ix,1);if(!U.cart.length)U.sheet=null;},
  discp:v=>{U.disc=+v?String(Math.round(cartTotal()*v/100/1000)*1000):''},
  pay:v=>{U.pay=v},
  setCid:v=>{U.cid=v||null;U.sheet='cart';U.f={}},
  sellTo:v=>{U.cid=v;U.tab='sell';U.sheet=null;toast(`Sotuv: ${cust(v).name}`)},
  checkout:()=>{
    if(!U.cart.length)return;if(U.pay==='nasiya'&&!U.cid)return;
    const items=U.cart.map(i=>{const p=prod(i.pid);return{pid:p.id,name:p.name,sku:p.sku,size:i.size,qty:i.qty,price:i.price,cost:p.cost}});
    const sub=items.reduce((a,i)=>a+i.price*i.qty,0);const disc=Math.min(sub,num(U.disc));
    const s={id:'s'+uid(),at:new Date().toISOString(),items,sub,discount:disc,total:sub-disc,pay:U.pay,cid:U.cid};
    items.forEach(i=>{const p=prod(i.pid);p.sizes[i.size]=Math.max(0,(+p.sizes[i.size]||0)-i.qty)});
    DB.sales.push(s);U.cart=[];U.disc='';U.cid=null;U.pay='naqd';save();U.sheet='sale:'+s.id+':new';U.f={};
  },
  newSale:()=>{U.sheet=null;U.tab='sell'},
  copyReceipt:v=>{const s=DB.sales.find(x=>x.id===v);if(s)copy(receiptText(s),'Chek nusxalandi — Telegram\'ga joylashingiz mumkin')},
  delSale:v=>{const s=DB.sales.find(x=>x.id===v);if(!s)return;s.items.forEach(i=>{const p=prod(i.pid);if(p&&p.sizes[i.size]!=null)p.sizes[i.size]=(+p.sizes[i.size]||0)+i.qty});DB.sales=DB.sales.filter(x=>x.id!==v);save();U.sheet=null;U.confirm=null;toast('Sotuv bekor qilindi, mahsulot omborga qaytdi')},
  doRestock:pid=>{const p=prod(pid);let n=0;Object.keys(p.sizes).forEach(s=>{const q=num(U.f['rs-'+s]);if(q){p.sizes[s]=(+p.sizes[s]||0)+q;n+=q}});if(!n){toast('Hech qaysi o\'lchamga son kiritilmadi');return}save();U.sheet='prod:'+pid;U.f={};toast(`${n} dona omborga qo'shildi`)},
  preset:v=>{U.f.preset=v},
  saveProd:id=>{
    const p=id?prod(id):null;const g=(k,d)=>U.f[k]!=null?U.f[k]:d;
    const name=String(g('name',p&&p.name||'')).trim();const price=num(g('price',p&&p.price));const cost=num(g('cost',p&&p.cost));
    if(!name){U.f._err='Mahsulot nomini yozing.';return}if(!price){U.f._err='Sotuv narxini kiriting.';return}
    const preset=g('preset',p?(p.cat==='Poyabzal'?'poyabzal':Object.keys(p.sizes)[0]==='Yagona'?'yagona':'kiyim'):'kiyim');
    const keep=p&&Object.keys(p.sizes).join()===PRESETS[preset].join();const sizes={};PRESETS[preset].forEach(s=>{sizes[s]=num(g('ps-'+s,keep?p.sizes[s]:0))});
    const rec={name,cat:g('cat',p?p.cat:"Ko'ylak"),color:g('color',p?p.color:'Qora'),cost,price,sku:String(g('sku',p?p.sku:'MD-'+(100+DB.products.length+1))).trim(),sizes};
    if(p){Object.assign(p,rec);U.sheet='prod:'+p.id}else{const np={id:'p'+uid(),...rec};DB.products.push(np);U.sheet='prod:'+np.id}
    save();U.f={};toast('Mahsulot saqlandi');
  },
  delProd:id=>{DB.products=DB.products.filter(p=>p.id!==id);U.cart=U.cart.filter(i=>i.pid!==id);save();U.sheet=null;U.confirm=null;toast("Mahsulot o'chirildi")},
  saveCust:v=>{
    const[id,back]=v.split('|');const c=id?cust(id):null;const g=(k,d)=>U.f[k]!=null?U.f[k]:d;
    const name=String(g('name',c&&c.name||'')).trim();const phone=String(g('phone',c?c.phone:'')).trim();
    if(!name){U.f._err='Mijoz ismini yozing.';return}
    const rec={name,phone,note:String(g('note',c&&c.note||'')).trim()};
    if(c){Object.assign(c,rec);U.sheet='cust:'+c.id}else{const nc={id:'c'+uid(),created:new Date().toISOString(),...rec};DB.customers.push(nc);if(back==='cart'){U.cid=nc.id;U.sheet='cart'}else U.sheet='cust:'+nc.id}
    save();U.f={};toast('Mijoz saqlandi');
  },
  delCust:id=>{DB.customers=DB.customers.filter(c=>c.id!==id);if(U.cid===id)U.cid=null;save();U.sheet=null;U.confirm=null;toast("Mijoz o'chirildi")},
  payDebt:id=>{const a=num(U.f.payd);if(!a){toast('Summani kiriting');return}DB.payments.push({id:'y'+uid(),cid:id,amount:Math.min(a,debtOf(id)),at:new Date().toISOString()});save();U.f={};toast(`${som(a)} qabul qilindi`)},
  payAll:id=>{const d=debtOf(id);if(d<=0)return;DB.payments.push({id:'y'+uid(),cid:id,amount:d,at:new Date().toISOString()});save();U.f={};toast('Qarz to\'liq yopildi')},
  copyPhone:id=>{const c=cust(id);if(c)copy(c.phone,'Raqam nusxalandi')},
  saveSettings:()=>{DB.store.name=String(U.f.sname!=null?U.f.sname:DB.store.name).trim()||"Do'kon";DB.store.seller=String(U.f.seller!=null?U.f.seller:DB.store.seller).trim();save();U.sheet=null;toast('Sozlamalar saqlandi')},
  exportFile:()=>{const ok=download(`dokon-zaxira-${dkey(new Date())}.json`,JSON.stringify(DB),'application/json');if(!ok)A.exportCopy();else toast('Zaxira fayli yuklab olindi')},
  exportCopy:()=>copy(JSON.stringify(DB),'Zaxira nusxa xotiraga olindi — Telegram "Saqlangan xabarlar"ga joylang'),
  doImport:()=>{try{const d=JSON.parse(U.f.imp||'');if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales))throw 0;DB=d;save();U.sheet=null;U.f={};toast('Ma\'lumotlar tiklandi')}catch(e){U.f._err="Bu matn zaxira nusxaga o'xshamaydi. To'liq nusxalanganini tekshiring."}},
  clearAll:()=>{DB={v:1,demo:false,store:{name:DB.store.name,seller:DB.store.seller},products:[],customers:[],sales:[],payments:[]};U.cart=[];U.cid=null;save();U.sheet=null;U.confirm=null;toast('Tozalandi — endi o\'z mahsulotlaringizni qo\'shing')},
  loadDemo:()=>{DB=seed();U.cart=[];save();U.sheet=null;toast('Namuna ma\'lumotlar yuklandi')},
  copyTSV:()=>{const rows=[['Sana','Vaqt','Mahsulot','O\'lcham','Soni','Narx','Summa','To\'lov','Mijoz'].join('\t')];DB.sales.forEach(s=>{const c=s.cid&&cust(s.cid);s.items.forEach(i=>rows.push([dkey(s.at),hm(s.at),i.name,i.size,i.qty,i.price,i.price*i.qty,PAY[s.pay][1],c?c.name:''].join('\t')))});copy(rows.join('\n'),'Nusxalandi — Excel\'ga joylang (Ctrl+V)')},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(!f)return;e.preventDefault();f(el.dataset.v);render();});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.q!=null){U.q[t.dataset.q]=t.value;render();return}
  if(t.dataset.f){U.f[t.dataset.f]=t.value;return}
  if(t.dataset.live==='disc'){U.disc=t.value;renderLayer();return}
  if(t.dataset.live==='cq'){U.f.cq=t.value;renderLayer();return}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset&&t.dataset.f&&t.tagName==='SELECT'){U.f[t.dataset.f]=t.value}
  if(t.id==='f-import'&&t.files&&t.files[0]){const r=new FileReader();r.onload=()=>{U.sheet='import';U.f={imp:String(r.result||'')};A.doImport();renderLayer();render()};r.readAsText(t.files[0]);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet){U.sheet=null;renderLayer()}});
render();
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&window.__PWA__)navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
